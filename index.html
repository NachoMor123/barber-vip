      const clients=state.customers.filter(c=>c.active!==false).sort((a,b)=>String(a.fullName||'').localeCompare(String(b.fullName||''),'es'));
      const suspended=subStatus().status==='suspended';
      modalRoot.innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cutModalTitle"><div class="modal-header"><div><h2 id="cutModalTitle">Sumar corte</h2><p>Elegí un cliente registrado o anotá un corte rápido sin crear una cuenta.</p></div><button class="close-modal" data-action="close-modal">×</button></div>${suspended?`<div class="notice" style="margin-bottom:12px">La cuenta está vencida. Renovala para poder sumar cortes.</div>`:''}<div class="quick-cut-card"><div><strong>＋ Sumar corte rápido</strong><p>Para una persona que no quiere registrarse. No modifica ningún ciclo de fidelización.</p></div><form id="walkInForm" autocomplete="off"><div class="form-field"><label for="walkInName">Nombre (opcional)</label><input id="walkInName" name="walkInLabel" autocomplete="off" data-lpignore="true" data-1p-ignore="true" maxlength="70" placeholder="Cliente de paso"></div><button class="btn btn-soft btn-block" type="submit" ${suspended?'disabled':''}>Registrar corte rápido</button></form></div><div class="login-divider"></div><label for="cutSearch" class="field-hint">CLIENTES REGISTRADOS</label><input id="cutSearch" class="searchbox" autocomplete="off" data-lpignore="true" placeholder="⌕ Escribí un nombre para filtrar…"><div class="cut-picker-list">${clients.map(c=>`<div class="cut-picker-row" data-cut-search="${escapeHtml(normalizeName(c.fullName))}"><div><strong>${escapeHtml(c.fullName)}</strong><small>${Number(c.totalCuts||0)} cortes · Ciclo ${cycleCount(c)}/${cycleLength(c)}</small></div><button class="btn btn-primary btn-mini" data-action="add-cut" data-id="${escapeHtml(c.uid)}" ${suspended?'disabled':''}>+ Sumar</button></div>`).join('')||`<div class="empty-state"><strong>Primero creá un cliente registrado</strong><button class="btn btn-soft btn-mini" data-action="new-client">Crear cliente</button></div>`}<div class="cut-picker-empty hidden" id="cutSearchEmpty">No encontramos clientes con ese nombre. Probá con otra búsqueda.</div></div></section></div>`;
    }
    async function saveCustomerForm(form) {
      const fd=new FormData(form); const id=form.dataset.id; const payload={fullName:fd.get('fullName'),password:fd.get('clientAccessSecret'),whatsapp:fd.get('whatsapp'),approximateVisitDays:Number(fd.get('approximateVisitDays')),cutStyle:fd.get('cutStyle')||'',conversationPreference:fd.get('conversationPreference')||''};
      const submit=$('button[type="submit"]',form); if(submit){submit.disabled=true;submit.textContent='Guardando…';}
      try { await api('/api/customers',{method:id?'PUT':'POST',body:JSON.stringify(id?{...payload,customerId:id}:{...payload})}); modalRoot.innerHTML=''; toast(id?'Cliente actualizado.':'Cliente creado correctamente.','success'); }
      catch(error){toast(error.message,'error');if(submit){submit.disabled=false;submit.textContent=id?'Guardar cambios':'Crear cliente';}}
    }
    function collectSchedule(){const mode=$('#scheduleMode')?.value==='double'?'double':'continuous';const days=$$('[data-schedule-day]').map(row=>({day:row.dataset.scheduleDay,enabled:$('[data-schedule-enabled]',row)?.checked||false,start1:$('[data-start1]',row)?.value||'',end1:$('[data-end1]',row)?.value||'',start2:$('[data-start2]',row)?.value||'',end2:$('[data-end2]',row)?.value||''}));return {mode,days};}
    function collectLoyaltyPrograms(){
      return $$('[data-program-card]').slice(0,1).map(card=>({id:card.dataset.programId||DEFAULT_LOYALTY_PROGRAM.id,name:$('[data-program-name]',card)?.value.trim()||'',audience:'all',customerIds:[],rewards:$$('[data-reward-row]',card).map(row=>({cut:Number($('[data-reward-cut]',row)?.value),discount:Number($('[data-reward-discount]',row)?.value)}))}));
    }
    function collectSettingsDraft(){
      const b=state.barber||{};
      return {profile:{displayName:$('#settingDisplayName')?.value.trim()??b.displayName??'',barberName:$('#settingBarberName')?.value.trim()??b.barberName??'',whatsapp:$('#settingWhatsapp')?.value.trim()??b.whatsapp??'',instagramUrl:$('#settingInstagram')?.value.trim()??b.instagramUrl??'',mapsUrl:$('#settingMaps')?.value.trim()??b.mapsUrl??'',schedule:collectSchedule(),theme:{accent:b.theme?.accent||'#b69cff',density:b.theme?.density||'comfortable'}},programs:collectLoyaltyPrograms()};
    }
    function preserveSettingsDraft(){return collectSettingsDraft();}
    function validateLoyaltyDraft(programs){
      if(!Array.isArray(programs)||programs.length!==1)throw new Error('La fidelización debe tener un único programa general.');
      const p=programs[0];p.audience='all';p.customerIds=[];
      if(!p.name.trim())throw new Error('Escribí un nombre para el programa de premios.');
      if(!p.id)throw new Error('No se pudo identificar el programa. Recargá la página.');
      if(!p.rewards.length||p.rewards.length>10)throw new Error('El programa necesita entre 1 y 10 etapas.');
      const rewards=[...p.rewards].sort((a,b)=>a.cut-b.cut);let last=0;
      for(const r of rewards){if(!Number.isInteger(r.cut)||r.cut<1||r.cut>50||r.cut<=last)throw new Error('Los números de corte deben ser únicos y estar ordenados entre 1 y 50.');if(!Number.isInteger(r.discount)||r.discount<1||r.discount>100)throw new Error('Cada descuento debe estar entre 1% y 100%.');last=r.cut;}
      p.rewards=rewards;
    }
    async function saveSettingsForm() {
      const draft=collectSettingsDraft();const payload=draft.profile;const formBtn=$('#settingsForm button[type="submit"]');
      const validUrl=(raw,hosts)=>!raw||!!safeExternalUrl(raw,hosts);
      if(payload.instagramUrl&&!validUrl(payload.instagramUrl,['instagram.com'])){toast('Revisá el enlace de Instagram.','error');return;}
      if(payload.mapsUrl&&!validUrl(payload.mapsUrl,['google.com','maps.app.goo.gl','goo.gl'])){toast('Revisá el enlace de Google Maps.','error');return;}
      if(formBtn){formBtn.disabled=true;formBtn.textContent='Guardando…';}
      try {
        const data=await api('/api/profile',{method:'PUT',body:JSON.stringify(payload)});
        state.barber={...state.barber,...data.profile};applyTheme(state.barber.theme);modalRoot.innerHTML='';renderApp();toast('Datos profesionales guardados.','success');
      } catch(error){toast(error.message,'error');if(formBtn){formBtn.disabled=false;formBtn.textContent='💾 Guardar datos';}}
    }
    async function saveAppearance(){
      const btn=$('[data-action="save-appearance"]');if(btn){btn.disabled=true;btn.textContent='Guardando…';}
      const b=state.barber||{};
      const payload={displayName:b.displayName||'',barberName:b.barberName||'',whatsapp:b.whatsapp||'',instagramUrl:b.instagramUrl||'',mapsUrl:b.mapsUrl||'',schedule:b.schedule||{mode:'continuous',days:[]},theme:{accent:$('#settingAccent')?.value||b.theme?.accent||'#b69cff',density:$('#settingDensity')?.value||b.theme?.density||'comfortable'}};
      try{const data=await api('/api/profile',{method:'PUT',body:JSON.stringify(payload)});state.barber={...state.barber,...data.profile};applyTheme(state.barber.theme);renderApp();toast('Apariencia guardada.','success');}
      catch(error){toast(error.message,'error');if(btn){btn.disabled=false;btn.textContent='💾 Guardar apariencia';}}
    }
    async function saveLoyaltySettings(){
      const programs=collectLoyaltyPrograms();
      try{validateLoyaltyDraft(programs);}catch(error){toast(error.message,'error');return;}
      const btn=$('[data-action="save-loyalty"]');if(btn){btn.disabled=true;btn.textContent='Guardando…';}
      try{
        const result=await api('/api/loyalty',{method:'PUT',body:JSON.stringify({programs})});
        state.barber={...state.barber,loyaltyPrograms:result.programs,defaultLoyaltyProgramId:result.defaultLoyaltyProgramId};
        if(Array.isArray(state.customers)&&result.defaultLoyaltyProgramId)state.customers=state.customers.map(c=>({...c,loyaltyProgramId:result.defaultLoyaltyProgramId}));
        renderApp();toast('Programa actualizado para todos los clientes.','success');
      }catch(error){toast(error.message,'error');if(btn){btn.disabled=false;btn.textContent='💾 Guardar programa de premios';}}
    }
    async function addCut(id) {
      try { const c=state.customers.find(x=>x.uid===id); if(!c)return; const result=await api('/api/cuts',{method:'POST',body:JSON.stringify({action:'add',customerId:id})});
        const earned=availableRewards(result.customer).filter(r=>!availableRewards(c).some(old=>Number(old.cut)===Number(r.cut)));toast('Corte sumado a '+c.fullName+'. '+(earned.length?`Desbloqueó ${earned.map(r=>r.label).join(', ')}.`:'') ,'success');
        if(modalRoot.innerHTML) { const wasPicker=$('#cutSearch',modalRoot); if(wasPicker){openCutModal();}else modalRoot.innerHTML=''; }
        await refreshStats(state.historyFrom,state.historyTo,{loadHistory:!state.historyHidden});
      } catch(error){toast(error.message,'error');}
    }
    async function redeemReward(id) {
      try{const c=state.customers.find(x=>x.uid===id);await api('/api/cuts',{method:'POST',body:JSON.stringify({action:'redeem',customerId:id})});toast(`Descuento de ${c?.fullName||'cliente'} marcado como canjeado.`,'success');modalRoot.innerHTML='';}
      catch(error){toast(error.message,'error');}
    }
    function contactClient(id, prefilled=false) {
      const c=state.customers.find(x=>x.uid===id); if(!c)return; const number=whatsappNumber(c.whatsapp); if(!validWhatsapp(c.whatsapp)){toast('Este cliente no tiene un WhatsApp válido.','error');return;}
      let url=`https://wa.me/${number}`;
      if(prefilled){const info=reminderInfo(c), cycle=cycleSummary(c), first=(c.fullName||'').split(' ')[0]||'¿cómo andás';const ready=cycle.ready;const msg=ready.length?`¡Hola ${first}! 👋 ¿Cómo andás? Tenés ${ready.map(r=>r.label||`${r.discount}% OFF`).join(' y ')} disponible en Barber VIP 🎁 Cuando quieras coordinamos tu próximo corte. ¡Te esperamos! ✂️`:`¡Hola ${first}! 👋 ¿Cómo andás? Hace ${info.days??'varios'} días que no te vemos por la barbería. Te ${cycle.left===1?'falta':'faltan'} ${cycle.left} corte${cycle.left===1?'':'s'} para tu próximo descuento de ${cycle.next.label}. Cuando quieras coordinamos. ¡Te esperamos! ✂️`;url+=`?text=${encodeURIComponent(msg)}`;}
      window.open(url,'_blank','noopener,noreferrer');
    }
    function contactBarber(prefilled) {
      const b=state.barber||{};const number=whatsappNumber(b.whatsapp);if(!validWhatsapp(b.whatsapp)){toast('Tu barbero todavía no configuró su WhatsApp.','error');return;}let url=`https://wa.me/${number}`;if(prefilled){const name=String(state.customer?.fullName||'').trim().split(/\s+/)[0]||'👋';url+=`?text=${encodeURIComponent(`Hola ${name}, tenés turnos disponibles.`)}`;}window.open(url,'_blank','noopener,noreferrer');
    }
    async function paySubscription() {
      try {const data=await api('/api/create-preference',{method:'POST',body:JSON.stringify({})});location.href=data.url;}
      catch(error){toast(error.message,'error');}
    }

    document.addEventListener('click',async event=>{
      const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
      try {
        if(action==='choose-login'){if(!firebaseConfigured()){toast('Primero configurá Firebase en index.html y volvé a cargar.','error');return;}renderLogin(button.dataset.mode);}
        else if(action==='go-home'||action==='close-modal'){if(action==='go-home')renderLanding();else modalRoot.innerHTML='';}
        else if(action==='backdrop-close'&&event.target===button){modalRoot.innerHTML='';}
        else if(action==='nav'){state.section=button.dataset.section;state.query='';renderApp();if(state.section==='home')refreshStats(state.historyFrom,state.historyTo,{loadHistory:!state.historyHidden});}
        else if(action==='logout'){signOutAndReturn();}
        else if(action==='new-client'){openCustomerModal();}
        else if(action==='edit-client'){openCustomerModal(button.dataset.id);}
        else if(action==='view-client'){openClientView(button.dataset.id);}
        else if(action==='customer-section'){state.customerSection=button.dataset.section==='barber'?'barber':'home';renderApp();}
        else if(action==='delete-client'){const id=button.dataset.id;const c=state.customers.find(x=>x.uid===id);if(confirm(`¿Dar de baja a ${c?.fullName||'este cliente'}? Ya no podrá iniciar sesión. El historial se conserva.`)){await api('/api/customers',{method:'DELETE',body:JSON.stringify({customerId:id})});modalRoot.innerHTML='';toast('Cliente dado de baja.','success');}}
        else if(action==='contact'){contactClient(button.dataset.id,false);}
        else if(action==='contact-reminder'){contactClient(button.dataset.id,false);}
        else if(action==='new-promotion'){openPromotionModal();}
        else if(action==='edit-promotion'){openPromotionModal(button.dataset.id);}
        else if(action==='toggle-promotion'){const p=state.promotions.find(x=>x.id===button.dataset.id);if(p){await api('/api/promotions',{method:'PUT',body:JSON.stringify({...p,active:p.active===false})});await loadPromotions();renderApp();toast(p.active===false?'Promoción activada.':'Promoción desactivada.','success');}}
        else if(action==='delete-promotion'){if(confirm('¿Eliminar esta promoción?')){await api('/api/promotions',{method:'DELETE',body:JSON.stringify({id:button.dataset.id})});await loadPromotions();renderApp();toast('Promoción eliminada.','success');}}
        else if(action==='open-profile-modal'){openBarberProfileModal();}
        else if(action==='save-appearance'){await saveAppearance();}
        else if(action==='save-loyalty'){await saveLoyaltySettings();}
        else if(action==='add-promo-emoji'){const input=$('#promoTitle',modalRoot);if(input){const emoji=button.dataset.emoji||'✨';const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;input.setRangeText(emoji,start,end,'end');input.focus();input.dispatchEvent(new Event('input',{bubbles:true}));}}
        else if(action==='open-cut-modal'){openCutModal();}
        else if(action==='toggle-history'){state.historyHidden=!state.historyHidden;try{localStorage.setItem('barberVipHistoryHidden',String(state.historyHidden));}catch(_){}renderApp();if(!state.historyHidden)await refreshStats(state.historyFrom,state.historyTo,{loadHistory:true});}
        else if(action==='filter-history'){const from=$('#historyFrom')?.value||'',to=$('#historyTo')?.value||'';if(!from||!to){toast('Elegí las dos fechas para filtrar el historial.','error');return;}if(from>to){toast('La fecha «Desde» no puede ser posterior a «Hasta».','error');return;}state.historyFrom=from;state.historyTo=to;await refreshStats(from,to,{loadHistory:true});}
        else if(action==='reset-history'){const today=new Date(),from=new Date();from.setDate(from.getDate()-59);state.historyFrom=localDateInput(from);state.historyTo=localDateInput(today);await refreshStats(state.historyFrom,state.historyTo,{loadHistory:true});}
        else if(action==='add-cut'){await addCut(button.dataset.id);}
        else if(action==='redeem'){await redeemReward(button.dataset.id);}
        else if(action==='save-settings'){openBarberProfileModal();}
        else if(action==='add-reward-step'){const card=button.closest('[data-program-card]');const rows=$$('[data-reward-row]',card);if(rows.length>=10){toast('El programa admite hasta 10 etapas de premio.','error');return;}const max=Math.max(0,...rows.map(row=>Number($('[data-reward-cut]',row)?.value)||0));const div=document.createElement('div');div.className='program-reward-row';div.dataset.rewardRow='';div.innerHTML='<label><span>✂️ Corte</span><input type="number" min="1" max="50" data-reward-cut required value="'+(max+1)+'"></label><label><span>🏷️ Descuento (%)</span><input type="number" min="1" max="100" data-reward-discount required value="10"></label><button type="button" class="btn btn-danger btn-mini" data-action="remove-reward-step" aria-label="Eliminar etapa">×</button>';$('.program-reward-rows',card).append(div);}
        else if(action==='remove-reward-step'){const row=button.closest('[data-reward-row]'),rows=$$('[data-reward-row]',button.closest('[data-program-card]'));if(rows.length<=1){toast('El programa necesita al menos un premio.','error');return;}row.remove();}
        else if(action==='pay'){await paySubscription();}
        else if(action==='copy-code'){await navigator.clipboard.writeText(state.barber?.barberCode||'');toast('Código de barbería copiado.','success');}
        else if(action==='book-turn'){contactBarber(true);}
        else if(action==='contact-barber'){contactBarber(false);}
      } catch(error){console.error(error);toast(error.message||'Ocurrió un error. Probá otra vez.','error');}
    });

    document.addEventListener('change',event=>{if(event.target.id==='promotionAudience'){const el=$('.promotion-select-clients',modalRoot);if(el)el.classList.toggle('hidden',event.target.value!=='selected');}
      if(event.target.id==='scheduleMode'){$$('.shift-double').forEach(el=>el.classList.toggle('hidden',event.target.value!=='double'));if(event.target.value==='double'){$$('[data-schedule-day]').forEach(row=>{const end=$('[data-end1]',row),start2=$('[data-start2]',row);if(end&&start2&&end.value==='18:00'&&start2.value==='16:00')end.value='13:00';});}}});
    document.addEventListener('submit',async event=>{
      const form=event.target;
      if(form.id==='promotionForm'){event.preventDefault();const fd=new FormData(form),id=form.dataset.id,audience=fd.get('audience');const toIso=v=>v?new Date(v).toISOString():null;const payload={title:String(fd.get('title')||'').trim(),description:'',conditions:'',startsAt:toIso(fd.get('startsAt')),endsAt:toIso(fd.get('endsAt')),audience,customerIds:audience==='selected'?fd.getAll('customerIds'):[],active:id?(state.promotions.find(p=>p.id===id)?.active!==false):true};const btn=$('button[type=submit]',form);btn.disabled=true;btn.textContent='Guardando…';try{await api('/api/promotions',{method:id?'PUT':'POST',body:JSON.stringify(id?{...payload,id}:payload)});modalRoot.innerHTML='';await loadPromotions();state.section='promotions';renderApp();toast('Promoción guardada.','success');}catch(error){toast(error.message,'error');btn.disabled=false;btn.textContent='Guardar promoción';}return;}
      if(form.id==='loginForm'){
        event.preventDefault();if(!firebaseReady){toast('Firebase todavía no está configurado.','error');return;}
        const fd=new FormData(form);const mode=form.dataset.mode;const button=$('button[type="submit"]',form);button.disabled=true;button.textContent='Ingresando…';state.manualLogin=true;
        try {
          await setPersistence(state.auth,browserLocalPersistence);
          if(mode==='barber'){
            await signInWithEmailAndPassword(state.auth,String(fd.get('email')).trim(),String(fd.get('accessPhraseInput')));
            await api('/api/profile',{method:'POST',body:JSON.stringify({action:'ensure'})});
          } else {
            const access=await api('/api/customer-login',{method:'POST',body:JSON.stringify({barberCode:fd.get('barberCode'),username:fd.get('username')})});
            await signInWithEmailAndPassword(state.auth,access.email,String(fd.get('accessPhraseInput')));
          }
          const me=await api('/api/me');await loadContext(me);state.manualLogin=false;
        } catch(error){state.manualLogin=false;button.disabled=false;button.textContent='Ingresar ↗';if(state.auth?.currentUser && !state.user){await signOut(state.auth).catch(()=>{});}let message=error.message||'No se pudo iniciar sesión.';if(message.includes('auth/invalid-credential')||message.includes('auth/wrong-password')||message.includes('auth/user-not-found'))message='Los datos de ingreso no coinciden. Revisalos y probá de nuevo.';else if(message.includes('auth/too-many-requests'))message='Hubo demasiados intentos. Esperá un momento antes de volver a probar.';toast(message,'error');}
      }
      if(form.id==='walkInForm'){event.preventDefault();const fd=new FormData(form),btn=$('button[type=submit]',form);btn.disabled=true;btn.textContent='Registrando…';try{await api('/api/cuts',{method:'POST',body:JSON.stringify({action:'walk-in',customerName:fd.get('walkInLabel')})});modalRoot.innerHTML='';toast('Corte rápido registrado en el historial.','success');await refreshStats(state.historyFrom,state.historyTo,{loadHistory:!state.historyHidden});}catch(error){toast(error.message,'error');btn.disabled=false;btn.textContent='Registrar corte rápido';}return;}
      if(form.id==='customerForm'){event.preventDefault();await saveCustomerForm(form);}
      if(form.id==='settingsForm'){event.preventDefault();await saveSettingsForm();}
    });

    document.addEventListener('input',event=>{
      const target=event.target;
      if(target.id==='clientSearch'){state.query=target.value;const reminders=state.section==='reminders';const list=filteredCustomers({remindersOnly:reminders});const results=$('#customerResults');if(results)results.innerHTML=customerResultsMarkup(list,reminders);const count=$('.result-count');if(count)count.textContent=reminders?`${list.length} por contactar`:`${list.length} clientes`;
      } else if(target.id==='cutSearch'){const q=normalizeName(target.value);let visible=0;$$('[data-cut-search]',modalRoot).forEach(row=>{const match=!q||row.dataset.cutSearch.includes(q);row.hidden=!match;if(match)visible++;});const empty=$('#cutSearchEmpty',modalRoot);if(empty)empty.classList.toggle('hidden',!q||visible>0);}
      else if(target.id==='settingAccent'){applyTheme({accent:target.value,density:$('#settingDensity')?.value});} else if(['settingDisplayName','settingWhatsapp','settingInstagram','settingMaps'].includes(target.id)||target.matches('[data-schedule-enabled], [data-start1], [data-end1], [data-start2], [data-end2]')){const bar=$('.profile-progress span');const pct=profileCompletion({...state.barber,displayName:$('#settingDisplayName')?.value,whatsapp:$('#settingWhatsapp')?.value,instagramUrl:$('#settingInstagram')?.value,mapsUrl:$('#settingMaps')?.value,schedule:collectSchedule()});const pctLabel=$('.profile-completion > strong');if(bar)bar.style.width=pct+'%';if(pctLabel)pctLabel.textContent=pct+'%';}
    });
    document.addEventListener('change',event=>{
      const target=event.target;
      if(target.id==='sortSelect'){state.sort=target.value;renderApp();}
      if(target.id==='historyFrom'){const to=$('#historyTo');if(to)to.min=target.value;}
      if(target.id==='historyTo'){const from=$('#historyFrom');if(from)from.max=target.value;}
      
      if(target.id==='settingDensity'){applyTheme({accent:$('#settingAccent')?.value,density:target.value});}
    });

    if(firebaseConfigured()) {
      try {
        const fbApp=initializeApp(firebaseConfig);state.auth=getAuth(fbApp);state.db=getFirestore(fbApp);firebaseReady=true;
        onAuthStateChanged(state.auth,user=>{state.authResolved=true;if(state.manualLogin)return;if(user){renderLoading();resumeSession(user);}else{clearListeners();if(state.user)cleanupContext();renderLanding();}});
      } catch(error){console.error('Firebase init error',error);}
    }
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('/sw.js').catch(err=>console.warn('SW register failed',err));
    if(firebaseReady) renderLoading(); else renderLanding();
  </script>
