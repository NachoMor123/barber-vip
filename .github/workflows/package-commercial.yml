name: Package Barber VIP commercial website for Firebase Hosting

on:
  push:
    branches: [main, hybrid-cloudflare]
    paths:
      - "web-comercial/**"
      - ".github/workflows/package-commercial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate and package Firebase commercial site
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/barber-vip-commercial"
          mkdir -p "$out"
          cp web-comercial/index.html "$out/index.html"
          cat > "$out/README.md" <<'EOF'
          # Barber VIP — web comercial

          Sitio estático publicado en Firebase Hosting:
          https://barber-vip-comercial-309dc.web.app

          Se mantiene dentro del repositorio principal en web-comercial/.
          Para publicar sólo este sitio desde la raíz del repositorio:

          ```bash
          firebase deploy --only hosting:comercial --project barbervip-309dc
          ```

          La aplicación principal está en https://barbervip-309dc.web.app.
          EOF
          test -s "$out/index.html"
          grep -q 'https://barber-vip-comercial-309dc.web.app/' "$out/index.html"
          grep -q 'https://barbervip-309dc.web.app/?signup=1' "$out/index.html"
          if grep -Eqi 'vercel\.app|vercel\.com|promociones?|notificaciones?' "$out/index.html"; then
            echo "La web comercial contiene referencias a Vercel o funciones retiradas."
            exit 1
          fi
          cd "$out"
          zip -qr "$GITHUB_WORKSPACE/BarberVIP-WebComercial.zip" .

      - name: Upload commercial website ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BarberVIP-WebComercial-Firebase
          path: BarberVIP-WebComercial.zip
          if-no-files-found: error
          retention-days: 7
