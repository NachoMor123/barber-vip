    const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const localDateInput = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const asDate = value => { if (value == null || value === '') return null; if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value; if (typeof value.toDate === 'function') { const d=value.toDate(); return d instanceof Date && !Number.isNaN(d.getTime()) ? d : null; } if (typeof value === 'object') { const seconds=Number(value.seconds ?? value._seconds); if (Number.isFinite(seconds) && seconds > 0) { const nanos=Number(value.nanoseconds ?? value._nanoseconds ?? 0); const d=new Date(seconds*1000+(Number.isFinite(nanos)?nanos:0)/1e6); return Number.isNaN(d.getTime()) ? null : d; } } const d = new Date(value); return Number.isNaN(d.getTime()) ? null : d; };

    const relativeTime = value => { const d=asDate(value); if(!d)return 'Sin actividad registrada'; const ms=Date.now()-d.getTime(); if(ms<60000)return 'Hace menos de 1 min'; if(ms<3600000)return `Hace ${Math.floor(ms/60000)} min`; if(ms<86400000)return `Hace ${Math.floor(ms/3600000)} h`; const days=Math.floor(ms/86400000); return days===1?'Hace 1 día':`Hace ${days} días`; };

    const normalizeName = value => String(value||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ');
    function argentinaLocalNumber(input){
      let n=String(input||'').trim().replace(/\D/g,'');
      if(n.startsWith('00'))n=n.slice(2);

      else if(n.startsWith('54')&&n.length===12)n=n.slice(2);

      if(n.length===12){const domestic=n.match(/^(\d{2,4})15(\d{6,8})$/);if(domestic)n=domestic[1]+domestic[2];}
      return n;

    function whatsappNumber(input) {
      let n=String(input||'').trim().replace(/\D/g,'');
      if(n.startsWith('00'))n=n.slice(2);

      if(n.startsWith('54')&&n.length===12)return '549'+n.slice(2);

        function renderApp() {
      const previousScrollY=window.scrollY;
      if(!state.user || !state.role) return renderLanding();
      applyTheme(state.role==='barber'?state.barber?.theme:state.barber?.theme);
      if(state.role==='barber') { appRoot.innerHTML=adminShell(); startPromoCountdowns(); }
      else { renderCustomer(); }
      // Update relative times immediately after painting; subsequent updates are local-only.
      refreshRelativeTimes();
      // Repainting after a Firestore snapshot should not unexpectedly jump the viewport.
      if(Math.abs(window.scrollY-previousScrollY)>1) window.scrollTo(0,previousScrollY);
      void maybeShowInstallPrompt();
    }

    async function refreshStats(from=state.historyFrom,to=state.historyTo,{loadHistory=!state.historyHidden}={}) {
      // The dashboard no longer requests aggregate counts. History is fetched only when the user explicitly opens it.
      if(!loadHistory)return;
      try {
        const u=new URL('/api/cuts',location.origin);
        if(from)u.searchParams.set('from',from);
        if(to)u.searchParams.set('to',to);
        u.searchParams.set('stats','0');
        const data=await api(u.pathname+u.search);
        state.history=Array.isArray(data.history)?data.history:[];
        state.historyFrom=from||state.historyFrom;
        state.historyTo=to||state.historyTo;
        state.historyNextCursor=data.historyNextCursor||null;
        state.historyHasMore=Boolean(data.historyHasMore);
        if(state.role==='barber'&&state.section==='home')renderApp();
      } catch(error){console.error(error); if(state.role==='barber')toast(error.message,'error');}
    }
    // En una PWA instalada se puede confirmar Atrás y el cierre de ventana. El sistema operativo aún puede forzar el cierre.
    (function installStandaloneExitGuard(){
      const standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;
      if(!standalone)return;
      let exitConfirmed=false;
      const restoreGuard=()=>history.pushState({barberVipExitGuard:true},'',location.href);
      restoreGuard();
      window.addEventListener('popstate',()=>{
        if(exitConfirmed)return;
        if(window.confirm('¿Querés salir de Barber VIP?')){
          exitConfirmed=true;
          return;
        }
        restoreGuard();
      });
      window.addEventListener('beforeunload',event=>{
        if(exitConfirmed)return;
        event.preventDefault();
        event.returnValue='';
      });
    })();

    async function loadMoreHistory(){if(!state.historyHasMore||!state.historyNextCursor)return;const btn=$('[data-action="load-more-history"]');if(btn){btn.disabled=true;btn.textContent='Cargando…';}try{const u=new URL('/api/cuts',location.origin);if(state.historyFrom)u.searchParams.set('from',state.historyFrom);if(state.historyTo)u.searchParams.set('to',state.historyTo);u.searchParams.set('cursor',state.historyNextCursor);u.searchParams.set('stats','0');const data=await api(u.pathname+u.search);state.history=[...(state.history||[]),...(Array.isArray(data.history)?data.history:[])];state.historyNextCursor=data.historyNextCursor||null;state.historyHasMore=Boolean(data.historyHasMore);renderApp();}catch(error){toast(error.message||'No se pudieron cargar más visitas.','error');if(btn){btn.disabled=false;btn.textContent='Ver 100 visitas más ↓';}}}

    async function ensureAdminCustomersLoaded(){
      if(state.role!=='barber')return;
      if(state.customersLoaded)return;
      if(state.customersLoadPromise)return state.customersLoadPromise;
      const promise=new Promise((resolve,reject)=>{
        let firstSnapshot=true;
        const clientsRef=collection(state.db,'barbers',state.barberUid,'customers');
        const unsubscribe=onSnapshot(clientsRef,snap=>{
          const next=snap.docs.map(d=>({uid:d.id,...d.data()}));
          state.customers=next;state.customersLoaded=true;
          if(firstSnapshot){firstSnapshot=false;resolve();}
          if(state.role!=='barber')return;
          renderApp();
        },err=>{
          console.error(err);state.customersLoaded=false;state.customersListenerStarted=false;
          if(firstSnapshot){firstSnapshot=false;reject(err);}
          else toast('No se pudieron actualizar los clientes. Revisá las reglas de Firestore.','error');
        });
        state.unsubscribers.push(unsubscribe);state.customersListenerStarted=true;
      });
      state.customersLoadPromise=promise;
      try{await promise;}
      catch(error){toast('No se pudieron cargar los clientes. Revisá la conexión y las reglas de Firestore.','error');throw error;}
      finally{if(state.customersLoadPromise===promise)state.customersLoadPromise=null;}
    }

    async function loadContext(me) {
      clearListeners(); state.subscriptionPrice=Number(me.subscriptionPrice)||SUBSCRIPTION_PRICE_ARS; state.user=state.auth.currentUser; state.role=me.role; state.barberUid=me.barberUid; state.loadError=false; startRelativeTimeClock();
      if(me.role==='barber') {
        state.barber=me.profile; state.customer=null; state.section=state.section||'home'; applyTheme(state.barber.theme);
        // /api/me ya devuelve el programa de fidelización normalizado; no repetimos lecturas al iniciar.
        const barberRef=doc(state.db,'barbers',me.barberUid);
        state.unsubscribers.push(onSnapshot(barberRef,snap=>{if(snap.exists()){const fresh=snap.data();const currentById=new Map((state.barber?.loyaltyPrograms||[]).map(p=>[p.id,p.customerIds||[]]));const safePrograms=Array.isArray(fresh.loyaltyPrograms)?fresh.loyaltyPrograms.map(p=>({...p,customerIds:currentById.get(p.id)||[]})):state.barber?.loyaltyPrograms;state.barber={...fresh,loyaltyPrograms:safePrograms,subscription:state.barber?.subscription};applyTheme(state.barber.theme); if(state.role==='barber')renderApp();}},err=>console.warn('barber snapshot',err)));
        renderApp();
      } else {
        state.customer=me.customer; state.barber=me.barber; state.customers=[]; applyTheme(state.barber.theme); await loadPromotions();
        const customerRef=doc(state.db,'barbers',me.barberUid,'customers',state.user.uid);
        state.unsubscribers.push(onSnapshot(customerRef,snap=>{
          if(!snap.exists())return;
          const fresh={uid:snap.id,...snap.data()};
          state.customer=fresh;
          renderApp();
        },err=>console.warn('customer snapshot',err)));
        // Watch only a safe, tiny revision document. Promotions are reloaded when the barber changes one,
        // not by polling Firestore on a timer and not by asking the customer to press Refresh.
        let promotionMetaInitial=true;
        const promotionMetaRef=doc(state.db,'barbers',me.barberUid,'publicMeta','promotions');
        state.unsubscribers.push(onSnapshot(promotionMetaRef,snap=>{
          const version=snap.exists()?promotionRevisionKey(snap.data().updatedAt):'';
          if(promotionMetaInitial){
            promotionMetaInitial=false;state.promoMetaVersion=version;
            // If the app fetched the profile just before a promotion was changed, catch up once.
            const profileRevision=promotionRevisionKey(state.barber?.promotionsUpdatedAt);
            if(snap.exists()&&version&&profileRevision&&version!==profileRevision){
              void loadPromotions().then(()=>{if(state.role==='customer'&&state.customerSection==='home')renderApp();});
            }
            return;
          }
          if(!snap.exists()||!version||version===state.promoMetaVersion)return;
          state.promoMetaVersion=version;
          void loadPromotions().then(()=>{if(state.role==='customer'&&state.customerSection==='home')renderApp();});
        },err=>{
          // If Firebase rules have not been published yet, fall back to a low-frequency check,
          // only while the customer app is visible. With the rule enabled, this timer never runs.
          console.debug('promotion revision listener unavailable',err.message);
          // No polling fallback: the promotion revision listener is the realtime update path.
        }));
        state.promotionsVersion=promotionRevisionKey(state.barber?.promotionsUpdatedAt);
        renderApp();
      }
      const payment=new URLSearchParams(location.search).get('payment');
      if(payment){history.replaceState({},'',location.pathname);setTimeout(()=>{if(payment==='success')toast('Volviste de Mercado Pago. Estamos verificando el pago; el estado se actualiza al confirmar el webhook.','success');else if(payment==='pending')toast('El pago quedó pendiente. El acceso se actualiza cuando Mercado Pago lo apruebe.');else if(state.role==='barber'&&subStatus().status==='active')toast('Tu cuenta sigue activa. No necesitás pagar nuevamente ahora.','success');else toast('El pago no se completó. Podés volver a intentarlo desde Configuración.','error');},300);}
    }
    async function resumeSession(user) {
      if(!user||state.manualLogin||!firebaseReady)return;
      try {
        let me;
        try { me=await api('/api/me'); }
        catch(error) {
          const missing=/No se encontró el perfil de esta cuenta/i.test(error.message);
          if(!missing) throw error;
          await user.getIdToken(true);
          await api('/api/profile',{method:'POST',body:JSON.stringify({action:'ensure',displayName:user.displayName||user.email?.split('@')[0]||'Profesional'})});
          me=await api('/api/me');
        }
        await loadContext(me);
      } catch(error) {
        console.warn('resume session',error.message);
        cleanupContext(); await signOut(state.auth).catch(()=>{}); renderLanding();
        if(/prueba gratuita/i.test(error.message)) toast(error.message,'error');
      }
    }

      const filterRows=()=>{
        if(!search||!list)return;
        const raw=String(search.value||'').trim();
        const query=normalizeName(raw);
        const phoneQuery=raw.replace(/\D/g,'');
        const rows=$$('.cut-picker-row',list);
        const matched=[];
        let shown=0;
        rows.forEach(row=>{
          const name=normalizeName(row.dataset.cutSearch||'');
          const phone=String(row.dataset.cutPhone||'');
          const nameMatch=!!query&&name.includes(query);
          const phoneMatch=phoneQuery.length>=3&&phone.includes(phoneQuery);
          const matches=!query||nameMatch||phoneMatch;
          row.hidden=!matches;
          row.style.display=matches?'flex':'none';
          row.setAttribute('aria-hidden',matches?'false':'true');
          if(matches){shown++;matched.push(row);}
        });
        // Prioritize exact/prefix name matches, then substring matches, then phone matches.
        if(query&&matched.length){
          matched.sort((a,b)=>{
            const score=row=>{const name=normalizeName(row.dataset.cutSearch||'');const phone=String(row.dataset.cutPhone||'');if(name===query)return 0;if(name.startsWith(query))return 1;if(name.includes(query))return 2;if(phoneQuery.length>=3&&phone.startsWith(phoneQuery))return 3;return 4;};

          });
          matched.forEach(row=>list.appendChild(row));
        }
        if(empty){const show=!!query&&shown===0;empty.hidden=!show;empty.style.display=show?'block':'none';}
      };
      if(search){search.addEventListener('input',filterRows);search.addEventListener('search',filterRows);search.setAttribute('aria-controls','cutPickerList');list?.setAttribute('id','cutPickerList');filterRows();}

        }catch(error){
          state.manualLogin=false;
          if(state.auth?.currentUser&&!state.user)await signOut(state.auth).catch(()=>{});
          let message=error.message||'No se pudo crear la cuenta. Probá nuevamente.';
          if(message.includes('auth/email-already-in-use'))message='Ya existe una cuenta para este registro. Probá iniciar sesión o consultá con tu profesional.';
          else if(message.includes('auth/weak-password'))message='Usá una contraseña de al menos 6 caracteres.';
          else if(message.includes('auth/too-many-requests'))message='Hubo demasiados intentos. Esperá un momento y probá otra vez.';
          toast(message,'error');button.disabled=false;button.textContent='Crear mi cuenta ↗';
        }finally{if(state.manualLogin)state.manualLogin=false;}
        return;
      }
      if(form.id==='loginForm'){
        event.preventDefault();if(!firebaseReady){toast('Firebase todavía no está configurado.','error');return;}
        const fd=new FormData(form),mode=form.dataset.mode,button=$('button[type="submit"]',form);button.disabled=true;button.textContent=mode==='barber-signup'?'Creando cuenta…':'Ingresando…';state.manualLogin=true;
        let createdCredential=null;
        try{
          await setPersistence(state.auth,browserLocalPersistence);
          if(mode==='barber-signup'){
            const displayName=String(fd.get('displayName')||'').trim(),email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('barberNewPassword')||'');
            if(displayName.length<2)throw new Error('Ingresá tu nombre.');
            if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('Ingresá un correo con formato válido. No hace falta verificarlo, pero Firebase necesita el formato correcto.');
            if(password.length<8)throw new Error('Usá una contraseña de al menos 8 caracteres.');
            createdCredential=await createUserWithEmailAndPassword(state.auth,email,password);
            await updateProfile(createdCredential.user,{displayName});
            await createdCredential.user.getIdToken(true);
            await api('/api/profile',{method:'POST',body:JSON.stringify({action:'ensure',displayName})});
            const me=await api('/api/me');
            state.pendingSignup=null;
            await loadContext(me);
            state.manualLogin=false;
            toast('¡Bienvenido a Barber VIP! Tu prueba gratuita de 15 días ya comenzó.','success');
            return;
          }
          if(mode==='barber'){
            await signInWithEmailAndPassword(state.auth,String(fd.get('email')||'').trim().toLowerCase(),String(fd.get('barberLoginPassword')||''));
            const user=state.auth.currentUser;
            let me=null;
            try{me=await api('/api/me');}
            catch(e){const missing=/No se encontró el perfil de esta cuenta/i.test(e.message);if(!missing)throw e;await user.getIdToken(true);await api('/api/profile',{method:'POST',body:JSON.stringify({action:'ensure',displayName:user.displayName||String(fd.get('email')).split('@')[0]})});me=await api('/api/me');}
            await loadContext(me);state.manualLogin=false;
          }else{
            const access=await api('/api/customer-login',{method:'POST',body:JSON.stringify({barberCode:fd.get('barberCode'),username:fd.get('username')})});
            await signInWithEmailAndPassword(state.auth,access.email,String(fd.get('barberLoginPassword')||''));
            const me=await api('/api/me');await loadContext(me);state.manualLogin=false;
          }
        }catch(error){
          state.manualLogin=false;button.disabled=false;button.textContent=mode==='barber-signup'?'Crear cuenta · 15 días gratis':'Ingresar ↗';
          if(createdCredential&&/ya utilizó una prueba gratuita/i.test(error.message||'')){
            // A trial claim conflict means no profile was created; remove only the account just created in this attempt.
            try{await deleteUser(createdCredential.user);}catch(cleanupError){console.warn('Could not remove uninitialized Firebase account',cleanupError);}
          }else if(state.auth?.currentUser&&!state.user){await signOut(state.auth).catch(()=>{});}
          let message=error.message||'No se pudo completar el acceso.';
          if(message.includes('auth/email-already-in-use'))message='Ya existe una cuenta con ese correo. Iniciá sesión con ella.';
          else if(message.includes('auth/invalid-email'))message='Revisá el formato del correo electrónico.';
          else if(message.includes('auth/invalid-credential')||message.includes('auth/wrong-password')||message.includes('auth/user-not-found'))message='Los datos de ingreso no coinciden. Revisalos y probá de nuevo.';
          else if(message.includes('auth/weak-password'))message='La contraseña debe tener al menos 8 caracteres.';
          else if(message.includes('auth/too-many-requests'))message='Hubo demasiados intentos. Esperá un momento antes de volver a probar.';
          toast(message,'error');
        }finally{if(state.manualLogin)state.manualLogin=false;}
      }

      if(form.id==='walkInForm'){event.preventDefault();const fd=new FormData(form),btn=$('button[type=submit]',form);btn.disabled=true;btn.textContent='Registrando…';try{await api('/api/cuts',{method:'POST',body:JSON.stringify({action:'walk-in',customerName:$('#walkInName',form)?.value||''})});modalRoot.innerHTML='';toast('Visita rápida registrado en el historial.','success');await refreshStats(state.historyFrom,state.historyTo,{loadHistory:!state.historyHidden});}catch(error){toast(error.message,'error');btn.disabled=false;btn.textContent='Registrar visita rápido';}return;}
      if(form.id==='customerForm'){event.preventDefault();await saveCustomerForm(form);}
    });

    document.addEventListener('focusout',event=>{const target=event.target;if(target instanceof HTMLInputElement&&target.matches('[data-argentina-mobile]')){const raw=String(target.value||'').trim();if(raw&&validWhatsapp(raw))target.value=argentinaLocalNumber(raw);}});

    document.addEventListener('input',event=>{
      const target=event.target;
      if(target.matches('[data-argentina-mobile]')){
        const raw=String(target.value||'').replace(/\D/g,'');
        if((raw.startsWith('549')&&raw.length===13)||(raw.startsWith('54')&&raw.length===12)||(raw.startsWith('0')&&raw.length===13&&/^0\d{2,4}15\d{6,8}$/.test(raw)))target.value=argentinaLocalNumber(raw);
      }
      if(target.id==='clientSearch'){state.query=target.value;const list=filteredCustomers();const results=$('#customerResults');if(results)results.innerHTML=customerResultsMarkup(list);const count=$('.result-count');if(count)count.textContent=`${list.length} clientes`;
      }
      else if(['settingDisplayName','settingWhatsapp','settingInstagram','settingMaps'].includes(target.id)||target.matches('[data-schedule-enabled], [data-day-mode], [data-start1], [data-end1], [data-start2], [data-end2]')){const root=target.closest('#profileEditForm')||modalRoot;const bar=$('.profile-progress span',root);const pct=profileCompletion({...state.barber,displayName:$('#settingDisplayName',root)?.value,whatsapp:argentinaLocalNumber($('#settingWhatsapp',root)?.value),instagramUsername:$('#settingInstagram',root)?.value,mapsUrl:$('#settingMaps',root)?.value,schedule:collectSchedule(root)});const pctLabel=$('.profile-completion > strong',root);if(bar)bar.style.width=pct+'%';if(pctLabel)pctLabel.textContent=pct+'%';}
    });
    document.addEventListener('change',event=>{
      const target=event.target;
      if(target.id==='sortSelect'){state.sort=target.value;renderApp();}
      if(target.id==='customerSourceFilter'){state.customerSourceFilter=target.value;renderApp();}
      if(target.id==='customerRewardFilter'){state.customerRewardFilter=target.value;renderApp();}
      if(target.id==='historyFrom'){const to=$('#historyTo');if(to)to.min=target.value;}
      if(target.id==='historyTo'){const from=$('#historyFrom');if(from)from.max=target.value;}
      
      if(target.id==='clientLoyaltyMode'){const box=$('#clientLoyaltyConfig',modalRoot);if(box){box.classList.toggle('hidden',target.value!=='custom');$$('input',box).forEach(input=>input.disabled=target.value!=='custom');}}
      if(target.id==='settingDensity'){saveDensityPreference(target.value);}
      if(target.id==='settingPipVisible'){try{localStorage.setItem('barberVipPipVisible',target.value==='on'?'true':'false');}catch(_){}renderApp();toast(target.value==='on'?'Guía rápida Pip activada.':'Guía rápida Pip oculta.','success');}
    });

    if(firebaseConfigured()) {
      try {
        const fbApp=initializeApp(firebaseConfig);state.auth=getAuth(fbApp);state.db=getFirestore(fbApp);firebaseReady=true;
        onAuthStateChanged(state.auth,user=>{state.authResolved=true;if(state.manualLogin)return;if(user){try{localStorage.removeItem('barberVipStartSignup');const url=new URL(location.href);if(url.searchParams.has('signup')){url.searchParams.delete('signup');history.replaceState({},'',url.pathname+(url.search||'')+url.hash);}}catch(_){}renderLoading();resumeSession(user);}else{clearListeners();if(state.user)cleanupContext();renderLanding();}});
      } catch(error){console.error('Firebase init error',error);}
    }
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;void maybeShowInstallPrompt();});
    window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installedPwaDetectionPromise=Promise.resolve(true);installPhase='instructions';renderInstallGate();});
    if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('/sw.js').catch(err=>console.warn('SW register failed',err));
    if(firebaseReady) renderLoading(); else renderLanding();
  </script>
</body>
</html>
