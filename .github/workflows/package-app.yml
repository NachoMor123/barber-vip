name: Package Barber VIP app without commercial website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate API, library and inline application JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find api lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          for name in ("package.json", "manifest.webmanifest", "vercel.json"):
              json.loads(Path(name).read_text(encoding="utf-8"))
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script\s*>", html, flags=re.IGNORECASE | re.DOTALL)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline application JavaScript was found.")
          Path("/tmp/barber-vip-inline.mjs").write_text(max(inline, key=len), encoding="utf-8")
          print(f"Validated JSON and extracted {len(inline)} inline script(s).")
          PY
          node --check /tmp/barber-vip-inline.mjs

      - name: Assemble application-only folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/barber-vip-app"
          cp index.html manifest.webmanifest sw.js package.json firestore.rules vercel.json env.example README.md invitacion.html "$RUNNER_TEMP/barber-vip-app/"
          cp -R api lib assets tests "$RUNNER_TEMP/barber-vip-app/"
          if find "$RUNNER_TEMP/barber-vip-app" -iname '*comercial*' | grep -q .; then
            echo "Unexpected commercial file found in app package" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/barber-vip-app"
          zip -qr "$GITHUB_WORKSPACE/BarberVIP-App.zip" .

      - name: Upload clean app ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BarberVIP-App
          path: BarberVIP-App.zip
          if-no-files-found: error
          retention-days: 7
