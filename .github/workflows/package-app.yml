name: Package Barber VIP hybrid app

on:
  push:
    branches: [main, hybrid-cloudflare]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Validate app and Worker
        shell: bash
        run: |
          set -euo pipefail
          find api lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --input-type=module --check < spark-api.js
          node --input-type=module --check < worker-config.js
          node --check worker/src/index.js
          node worker/test/check-app-syntax.mjs
          node --test
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("package.json", "manifest.webmanifest", "firebase.json", ".firebaserc", "worker/wrangler.jsonc"):
              json.loads(Path(name).read_text(encoding="utf-8"))
          print("Validated app and Firebase/Cloudflare configuration JSON.")
          PY

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Build Worker without deploying
        working-directory: worker
        run: npx wrangler deploy --dry-run

      - name: Assemble hybrid application package
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/barber-vip-hybrid"
          mkdir -p "$DEST"
          cp index.html manifest.webmanifest sw.js firebase.json .firebaserc firestore.rules \
            spark-api.js worker-config.js billing-admin.html README.md SPARK-SETUP.md package.json invitacion.html "$DEST/"
          cp -R assets worker "$DEST/"
          rm -rf "$DEST/worker/node_modules" "$DEST/worker/.wrangler" "$DEST/worker/.dev.vars"
          cd "$DEST"
          zip -qr "$GITHUB_WORKSPACE/BarberVIP-Hybrid.zip" .

      - name: Upload hybrid app ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BarberVIP-Hybrid
          path: BarberVIP-Hybrid.zip
          if-no-files-found: error
          retention-days: 14
