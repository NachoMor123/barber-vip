name: Package Barber VIP app without commercial website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Assemble application-only folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/barber-vip-app"
          cp index.html manifest.webmanifest sw.js package.json firestore.rules vercel.json env.example README.md invitacion.html "$RUNNER_TEMP/barber-vip-app/"
          cp -R api lib assets "$RUNNER_TEMP/barber-vip-app/"
          if find "$RUNNER_TEMP/barber-vip-app" -iname '*comercial*' | grep -q .; then
            echo "Unexpected commercial file found in app package" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/barber-vip-app"
          zip -qr "$GITHUB_WORKSPACE/BarberVIP-App.zip" .

      - name: Upload clean app ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BarberVIP-App
          path: BarberVIP-App.zip
          if-no-files-found: error
          retention-days: 7
