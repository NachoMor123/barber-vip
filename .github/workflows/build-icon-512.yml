name: Build Barber VIP app icons from SVG master

on:
  push:
    branches: [main]
    paths:
      - "assets/icon.svg"
      - ".github/workflows/build-icon-512.yml"

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Render all app icons from the SVG master
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow CairoSVG
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import cairosvg
          from PIL import Image

          source = Path("assets/icon.svg")
          artwork = source.read_bytes()

          outputs = [
              (192, Path("assets/icon-192.webp"), "WEBP"),
              (512, Path("assets/icon-512.png"), "PNG"),
          ]

          for size, target, image_format in outputs:
              rendered = cairosvg.svg2png(
                  bytestring=artwork,
                  output_width=size,
                  output_height=size,
              )
              with Image.open(BytesIO(rendered)) as image:
                  image.load()
                  if image.size != (size, size):
                      raise SystemExit(f"Unexpected {size}px render: {image.size}")
                  rgb = image.convert("RGB")
                  if image_format == "WEBP":
                      rgb.save(target, "WEBP", quality=94, method=6)
                  else:
                      rgb.save(target, "PNG", optimize=True)
              print(f"Created {target} ({target.stat().st_size} bytes)")

          sw = Path("sw.js")
          cache = sw.read_text()
          import re
          updated_cache, replacements = re.subn(
              r"(barber-vip-shell-v)(\d+)(-[a-z0-9-]+)",
              lambda match: f"{match.group(1)}{int(match.group(2)) + 1}{match.group(3)}",
              cache,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not increment the PWA cache version.")
          sw.write_text(updated_cache)
          PY

      - name: Commit generated icons and refresh installed PWA cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.webp assets/icon-512.png sw.js
          if git diff --cached --quiet; then
            echo "App icons are already current."
            exit 0
          fi
          git commit -m "Generate matching Barber VIP app icons"
          git pull --rebase origin main
          git push
